apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.kylin.skindemo'
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.kylin.skindemo"
        // 比亚迪官方 SDK 要求 minSdk 28
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.4.8"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'

    // Compose
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation platform('androidx.compose:compose-bom:2023.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation project(':skinlibrary')
    // 比亚迪官方控件演示模块
    implementation project(':bydwidget')
}

// ============ 皮肤包自动同步（皮肤是宿主资源） ============
// 皮肤包（.skin）是**宿主项目的主题资源**，主题库（skinlibrary）只提供换肤能力、不内置皮肤。
// 坑：改了 skinpackage 的资源（colors/strings/dimens/drawable）后若忘记重新构建并拷贝
//     release APK 到 assets/skin/skindemo.skin，App 切肤时读到的仍是旧皮肤包，表现为
//     「颜色变了但尺寸/图片/文案没变」。此任务把「构建皮肤包 → 拷贝到宿主 assets」自动化，
//     并挂到 app preBuild 前，宿主构建即自动同步，消除手工拷贝遗漏。
// App 启动时 AssetsUtils.doCopy(this, "skin", ...) 读的正是宿主自己的 assets。
def skinAssetDir = "$projectDir/src/main/assets/skin"
def skinSourceApk = "$rootDir/skinpackage/build/outputs/apk/release/skinpackage-release-unsigned.apk"

task syncSkinAsset(type: Copy) {
    dependsOn ':skinpackage:assembleRelease'
    from file(skinSourceApk)
    into skinAssetDir
    rename { 'skindemo.skin' }
    doLast {
        println "[syncSkinAsset] 已同步皮肤包 → ${skinAssetDir}/skindemo.skin"
    }
}

// 宿主资源合并前先同步皮肤包（preBuild 最早触发，保证 assets 最新再参与后续合并）
tasks.whenTaskAdded { task ->
    if (task.name == 'preBuild') {
        task.dependsOn 'syncSkinAsset'
    }
}
